# Render blueprint for the backend (Docker).
# After "Apply", set OPENAI_API_KEY in the service's Environment tab (it is marked sync: false so
# the value is never stored in git). The index builds on first start (~30 s, ~$0.005).
services:
  - type: web
    name: cybersec-rag-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: openai/gpt-4.1-mini
      - key: EMBEDDING_MODEL
        value: openai/text-embedding-3-small
      - key: FRONTEND_ORIGIN
        value: https://cybersec-rag-copilot-tan.vercel.app
